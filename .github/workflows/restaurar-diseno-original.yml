name: Restaurar diseño original COPAFEM

on:
  push:
    paths:
      - '.github/workflows/restaurar-diseno-original.yml'

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Recuperar versión original COPAFEM V3 Plata
        shell: bash
        run: |
          curl --fail --location --compressed --retry 3 \
            'https://kzwdikirhgkjdbwyzsez.supabase.co/functions/v1/copafem-app' \
            --output index.html
          test -s index.html
          grep -q 'COPAFEM' index.html
          grep -q 'COPAFEM_REMOTE_VALIDATE' index.html
          grep -q 'S-R16-8' index.html

      - name: Guardar diseño original
        shell: bash
        run: |
          git config user.name "COPAFEM Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restaurar diseño original COPAFEM con logo"
            git push
          fi
