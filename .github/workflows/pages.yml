name: Publicar COPAFEM en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Aplicar portada COPAFEM completa
        run: python tools/apply_cover_complete.py
      - name: Colocar logo COPAFEM enviado por el usuario
        run: python tools/patch_cover_user_logo.py
      - name: Habilitar torneos de 6 a 24 parejas
        run: python tools/patch_dynamic_pairs.py
      - name: Desempatar zonas por games
        run: python tools/patch_zone_tiebreak_games.py
      - name: Actualizar GF GC DG en vivo
        run: python tools/patch_live_zone_games.py
      - name: Mostrar cruces futuros de Oro y Plata
        run: python tools/patch_visible_future_cup_matches.py
      - name: Asignar canchas sin superposición
        run: python tools/patch_court_allocator.py
      - name: Corregir borrado de resultados
        run: python tools/patch_clear_results.py
      - name: Agregar canchas extra por horario
        run: python tools/patch_extra_courts_by_time.py
      - name: Elegir formato de Oro y Plata
        run: python tools/patch_drop_format_selector.py
      - name: Agregar Opción 3 máximo cupo
        run: python tools/patch_drop_format_op3.py
      - name: Mostrar solo zonas y cruces reales con horario/cancha
        run: python tools/patch_drop_schedule.py
      - name: Agrandar el Drop para impresión
        run: python tools/patch_print_drop_large.py
      - name: Imprimir solo zonas y cruces reales
        run: python tools/patch_print_real_only.py
      - name: Abrir Drop completo al 100%
        run: python tools/patch_drop_default_100.py
      - name: Mostrar zona, número y nombres completos
        run: python tools/patch_drop_zone_full_names.py
      - name: Mostrar zonas A-B, C-D en filas
        run: python tools/patch_drop_zones_two_columns.py
      - name: Imprimir una zona por hoja en Resultados
        run: python tools/patch_print_results_one_zone.py
      - name: Auditoría final de botones, resultados, impresión y Drop
        run: python tools/patch_final_web_audit.py
      - name: Reforzar runtime, botones e impresión por categoría
        run: python tools/patch_runtime_print_reliability.py
      - name: Validar sitio antes de publicar
        run: python tools/validate_final_site.py
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
